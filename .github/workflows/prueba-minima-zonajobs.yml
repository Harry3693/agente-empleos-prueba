name: Agente de empleos ZonaJobs

on:
  workflow_dispatch:
  schedule:
    # Una actualización por hora, sin depender de que la PC esté encendida.
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: agente-empleos-zonajobs
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: batch-runner
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Recuperar navegador descargado
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-22.10.0-${{ runner.os }}

      - name: Instalar navegador y dependencias
        run: npm install --omit=dev --no-audit --no-fund

      - name: Ejecutar pruebas de seguridad
        run: npm test

      - name: Procesar la cola completa
        run: npm start
        env:
          APPS_SCRIPT_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}
          ZONAJOBS_BATCH_TOKEN: ${{ secrets.ZONAJOBS_BATCH_TOKEN }}
